<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare products · Tradex</title>
  <link rel="stylesheet" href="assets/tradex.css">
  <style>
    .cmp-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-top: 14px; }
    .cmp-tools { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 16px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); margin-top: 16px; }
    .cmp-wrap { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); margin-top: 16px; overflow: clip; }
    .cmp { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13px; font-variant-numeric: normal; }
    .cmp col.lbl { width: 200px; }
    .cmp th, .cmp td { padding: 12px 16px; border-bottom: 1px solid var(--line-2); border-right: 1px solid var(--line-2); vertical-align: top; text-align: left; }
    .cmp tr > *:last-child { border-right: 0; }
    .cmp tbody th { font-weight: 600; color: var(--tx-2); background: #fafbfc; font-size: 12.5px; }
    .cmp thead th { background: #fff; position: sticky; top: 68px; z-index: 5; border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 var(--line); vertical-align: top; font-weight: 500; }
    .cmp thead th.lbl-h { background: #fafbfc; }
    .cmp .grp td { background: #f4f6fa; font-weight: 700; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--tx-3); padding: 8px 16px; }
    .cmp .pc { display: flex; flex-direction: column; gap: 8px; position: relative; }
    .cmp .pc .ph { aspect-ratio: 4 / 3; }
    .cmp .pc .rm { position: absolute; top: 6px; right: 6px; z-index: 3; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(255,255,255,.95); box-shadow: var(--sh-1); display: grid; place-items: center; color: var(--tx-2); }
    .cmp .pc .rm:hover { color: var(--bad-tx); }
    .cmp .pc .ttl { font-weight: 650; font-size: 13.5px; color: var(--tx-1); line-height: 1.35; }
    .cmp .pc .brand { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tx-3); }
    .cmp .slot { background: #fcfcfd; }
    .add-slot { border: 2px dashed var(--line); border-radius: var(--r); padding: 18px 14px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; text-align: center; color: var(--tx-3); min-height: 260px; justify-content: center; }
    .add-slot .ic { margin: 0 auto; width: 28px; height: 28px; color: var(--brand); }
    .cmp.hl tr.is-diff td:not(.slot) { background: #fffbeb; }
    .cmp.hl tr.is-diff th::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-right: 7px; vertical-align: 1px; }
    .cmp.hide-same tr.is-same { display: none; }
    .na { color: var(--tx-4); font-style: italic; }
    .miss { color: var(--tx-4); font-style: italic; display: inline-flex; gap: 5px; align-items: center; }
    .best { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--ok-tx); background: var(--ok-50); padding: 1px 6px; border-radius: 4px; margin-top: 4px; }
    .cmp td .price .p-now { font-size: 18px; }
    .cmp td .stockline span { display: inline-flex; gap: 5px; align-items: center; font-weight: 600; }
    #compare-tray { display: none !important; }
    .legend-diff { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tx-3); }
    .legend-diff i { width: 14px; height: 14px; border-radius: 3px; background: #fffbeb; border: 1px solid #f8dca6; display: inline-block; }
  </style>
</head>
<body data-app="store" data-page="compare">
<main>
  <div class="container">
    <nav class="crumbs mt-16" aria-label="Breadcrumb"><a href="store-home.html">Home</a><i data-icon="chevron-right"></i><span id="crumb-cat"></span><i data-icon="chevron-right"></i><span>Compare</span></nav>
    <div class="cmp-head">
      <div>
        <h1>Compare products</h1>
        <p class="muted mt-4" id="cmp-sub"></p>
      </div>
      <div class="row gap-8" data-anno="Prototype: compare states (§6.3)">
        <span class="small muted">Load</span>
        <div class="seg" id="src-seg">
          <button data-src="mine">Your selection</button>
          <button data-src="cameras">Example: cameras</button>
          <button data-src="mixed">Example: different categories</button>
        </div>
      </div>
    </div>

    <div id="warn"></div>

    <div class="cmp-tools" data-anno="1A · Highlight differences / hide identical rows">
      <label class="switch"><input type="checkbox" id="hl" checked> Highlight differences</label>
      <label class="switch"><input type="checkbox" id="hide-same"> Hide identical rows</label>
      <span class="legend-diff"><i></i> Values differ</span>
      <span class="ml-auto row gap-8">
        <button class="btn btn-sm" data-toast="Comparison link copied · tradex.in/compare/7Hq2"><i data-icon="link"></i> Share</button>
        <button class="btn btn-sm" onclick="window.print()"><i data-icon="printer"></i> Print</button>
        <button class="btn btn-sm btn-danger" id="clear"><i data-icon="trash"></i> Clear all</button>
      </span>
    </div>

    <div class="cmp-wrap" data-anno="1A · R01 Side-by-side specs from category template · mobile scrolling in Phase 2">
      <table class="cmp hl" id="cmp"></table>
    </div>
    <div id="too-few"></div>

    <section class="section">
      <div class="section-head"><div><h2>Often compared with these</h2><p>Tick “Compare” on any card to add it (up to 4)</p></div></div>
      <div class="pgrid cols-5" id="more"></div>
    </section>
  </div>
</main>
<script src="assets/tradex.js"></script>
<script>
TX.ready(() => {
  const $ = TX.$, $$ = TX.$$, ic = TX.icon, fmt = TX.fmt, esc = TX.esc;
  const as = TX.param("as"); if (["guest", "consumer", "dealer"].includes(as)) TX.setView(as);

  /* Category attribute templates (same source as product pages) */
  const LAP_L = ["Processor", "Graphics", "Memory (RAM)", "Display", "Storage", "Ports", "Wireless", "Webcam", "Weight", "Battery", "Keyboard", "Colour", "Operating system"];
  const LAP = {
    "lap-01": ["Intel Core i5-1145G7 (4 cores, 4.4 GHz)", "Intel Iris Xe", "16 GB DDR4 · upgradable to 64 GB", '14" FHD IPS, 250 nits', "512 GB NVMe SSD", "2× Thunderbolt 4, 2× USB-A, HDMI, RJ-45, microSD", "Wi-Fi 6, BT 5.1", "720p + privacy shutter", "1.36 kg", "63 Wh · unit health 91%", "Backlit", "Grey", "Windows 11 Pro"],
    "lap-02": ["AMD Ryzen 5 PRO 5650U (6 cores, 4.2 GHz)", "AMD Radeon integrated", "16 GB DDR4 · 8 GB soldered", '14" FHD IPS, 300 nits', "256 GB NVMe SSD", "2× USB-C, 2× USB-A, HDMI, RJ-45", "Wi-Fi 6, BT 5.2", "720p + ThinkShutter", "1.47 kg", "50 Wh · unit health 84%", "Backlit, TrackPoint", "Black", "Windows 11 Pro"],
    "lap-03": ["Apple M2 (8-core CPU)", "Apple 8-core GPU", "8 GB unified · not upgradable", '13.6" Liquid Retina, 500 nits', "256 GB SSD", "2× Thunderbolt/USB 4, MagSafe 3", "Wi-Fi 6, BT 5.3", "1080p", "1.24 kg", "52.6 Wh · 3 cycles", "Backlit, Touch ID", "Midnight", "macOS Sequoia"],
    "lap-04": ["Intel Core i7-12700H (14 cores, 4.7 GHz)", "NVIDIA RTX 3050 4 GB", "16 GB DDR4 · upgradable to 32 GB", '15.6" FHD 144 Hz', "512 GB NVMe SSD", "Thunderbolt 4, 2× USB-A, HDMI, RJ-45", "Wi-Fi 6, BT 5.2", "720p", "2.2 kg", "90 Wh", "RGB backlit", "Mecha Grey", "Windows 11 Home"],
    "lap-05": ["Intel Core i5-1335U (10 cores, 4.6 GHz)", "Intel Iris Xe", "16 GB DDR4", '15.6" FHD IPS, 250 nits', "512 GB NVMe SSD", "USB-C, 2× USB-A, HDMI", "Wi-Fi 6, BT 5.3", "720p", "1.74 kg", "41 Wh", "Backlit", "Natural Silver", "Windows 11 Home + Office"],
    "lap-06": ["Intel Core i9-13900H (14 cores, 5.4 GHz)", "NVIDIA RTX 4060 8 GB", "32 GB LPDDR5 · soldered", '14.5" 2.8K OLED 120 Hz + ScreenPad', "1 TB NVMe SSD", "2× Thunderbolt 4, USB-A, HDMI, SD", "Wi-Fi 6E, BT 5.2", "1080p IR", "1.75 kg", "76 Wh", "Backlit", "Tech Black", "Windows 11 Home"],
    "lap-07": ["Intel Core i7-1355U (10 cores, 5.0 GHz)", "Intel Iris Xe", "16 GB LPDDR5x · soldered", 'Dual 13.3" 2.8K OLED touch', "1 TB NVMe SSD", "3× Thunderbolt 4", "Wi-Fi 6E, BT 5.2", "5 MP IR", "1.34 kg", null, "Detachable Bluetooth", "Tidal Teal", "Windows 11 Home"],
    "lap-08": ["Apple M1 Pro (10-core CPU)", "Apple 16-core GPU", "16 GB unified · not upgradable", '14.2" Liquid Retina XDR 120 Hz', "512 GB SSD", "3× Thunderbolt 4, HDMI, SDXC, MagSafe 3", "Wi-Fi 6, BT 5.0", "1080p", "1.6 kg", "70 Wh · unit health 89%", "Backlit, Touch ID", "Space Grey", "macOS Sequoia"],
  };
  const CAM_L = ["Sensor", "Resolution", "Lens mount", "Lens in the box", "Video", "Stabilisation", "Viewfinder", "Rear screen", "Weight", "Battery life", "Shutter count"];
  const CAM = {
    "cam-01": ["Full-frame CMOS", "26.2 MP", "Canon EF", "Body only", "Full HD 60p", "Lens-based", "Optical, 98%", '3" vari-angle touch', "765 g", "≈ 1,200 shots", "18,420 (this unit)"],
    "cam-02": ["Full-frame BSI CMOS", "24.2 MP", "Sony E", "FE 28-70 mm", "4K 30p", "5-axis IBIS", "OLED EVF 2.36M", '3" tilting touch', "650 g", "≈ 710 shots", "New (0)"],
    "cam-03": ["APS-C CMOS", "24.2 MP", "Canon EF / EF-S", "EF-S 18-135 mm IS USM", "Full HD 60p", "Lens-based", "Optical, 100%", '3" vari-angle touch', "730 g", "≈ 960 shots", "41,300 (this unit)"],
    "cam-04": ["APS-C CMOS", "24.1 MP", "Canon EF / EF-S", "EF-S 18-55 mm", "Full HD 30p", "Lens-based", "Optical, 95%", '3" fixed', "475 g", "≈ 500 shots", "New (0)"],
    "cam-05": ["APS-C X-Trans 4", "26.1 MP", "Fujifilm X", "XF 18-55 mm", "4K 30p", "Lens OIS", "OLED EVF 2.36M", '3" tilting touch', "378 g", "≈ 390 shots", "New (0)"],
    "cam-06": ['1" stacked CMOS', "20.1 MP", "Fixed lens", "Built-in 24-200 mm", "4K 30p", "Optical SteadyShot", "Pop-up OLED EVF", '3" tilting', "302 g", "≈ 260 shots", null],
  };
  const TPL = { laptops: [LAP_L, LAP], cameras: [CAM_L, CAM] };

  const EXAMPLES = { cameras: ["cam-01", "cam-02", "cam-05"], mixed: ["lap-01", "ssd-01", "cam-03"] };
  let src = ["mine", "cameras", "mixed"].includes(TX.param("example")) ? TX.param("example") : "mine";
  let ids = [], usingFallback = false;
  const FALLBACK = ["lap-01", "lap-02", "lap-08"];
  const load = () => { usingFallback = false; ids = src === "mine" ? TX.store.get("compare", []).slice(0, 4) : EXAMPLES[src].slice(); if (src === "mine" && !ids.length) { ids = FALLBACK.slice(); usingFallback = true; } };
  const save = () => { if (src === "mine") TX.store.set("compare", ids); };

  const warrP = (p) => (/Tradex/.test(p.warranty) ? "Tradex" : p.brand);
  const months = (p) => { const m = p.warranty.match(/(\d+)-(month|year)/); return /Lifetime/.test(p.warranty) ? 999 : m ? (+m[1]) * (m[2] === "year" ? 12 : 1) : 12; };
  const vp = (p) => (TX.view === "dealer" ? p.dealer : p.price);
  const kg = (s) => (s ? parseFloat(s) * (/ g$/.test(s) ? 0.001 : 1) : 99);

  function render() {
    const P = ids.map(TX.byId);
    const cats = [...new Set(P.map((p) => p.cat))];
    const mixed = cats.length > 1;
    const catName = (c) => (TX.categories.find((x) => x.id === c) || { name: c }).name;
    $("#crumb-cat").innerHTML = mixed ? "Mixed categories" : `<a href="store-listing.html?cat=${cats[0]}">${catName(cats[0] || "laptops")}</a>`;
    $("#cmp-sub").textContent = `${P.length} of 4 products · ${mixed ? "different categories" : catName(cats[0] || "laptops")} · ${TX.view === "dealer" ? "Dealer prices excl. GST" : "Prices include GST"} · stock & prices are live`;
    $$("#src-seg button").forEach((b) => b.classList.toggle("active", b.dataset.src === src));

    $("#warn").innerHTML = mixed ? `<div class="callout c-warn mt-16" data-anno="§6.3 Comparison state: different categories"><i data-icon="alert"></i><div class="grow"><strong>You're comparing products from different categories</strong> (${cats.map(catName).join(", ")}). Only shared details — price, condition, warranty, delivery — can be compared. Category-specific specifications are shown as “Not applicable”.</div><button class="btn btn-sm" id="only-first">Compare only ${catName(P[0].cat).toLowerCase()}</button></div>` : "";

    if (P.length < 2) {
      $("#cmp").innerHTML = "";
      $(".cmp-wrap").classList.add("hidden");
      $("#too-few").innerHTML = `<div class="card empty mt-16"><i data-icon="compare"></i><h4>${P.length ? "Add one more product to compare" : "Nothing to compare yet"}</h4><p>Tick “Compare” on up to 4 product cards, or pick from the suggestions below.</p><div class="row mt-16" style="justify-content:center"><a class="btn btn-primary" href="store-listing.html?cat=${P[0] ? P[0].cat : "laptops"}">Browse ${P[0] ? catName(P[0].cat).toLowerCase() : "laptops"}</a><button class="btn" id="restore">Restore example (3 laptops)</button></div></div>`;
      TX.hydrate($("#too-few"));
      renderMore(P);
      return;
    }
    $(".cmp-wrap").classList.remove("hidden");
    $("#too-few").innerHTML = "";

    const slot = P.length < 4;
    const cols = `<colgroup><col class="lbl">${P.map(() => "<col>").join("")}${slot ? "<col>" : ""}</colgroup>`;
    const minPrice = Math.min(...P.map(vp));
    const head = `<thead><tr><th class="lbl-h"><div class="small muted" style="font-weight:500">${P.length} products</div><div class="mt-8 small" style="font-weight:500;color:var(--tx-2)">Rows marked <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn)"></span> differ between products.</div></th>
      ${P.map((p) => `<th><div class="pc"><button class="rm" data-rm="${p.id}" aria-label="Remove ${esc(p.title)} from comparison">${ic("x", "ic-sm")}</button>${TX.ph(p.img)}<span class="brand">${p.brand}</span><a class="ttl clamp-2" href="store-product.html?id=${p.id}">${esc(p.title)}</a>
        <div class="row gap-8"><span class="rating-pill">${p.rating} ${ic("star")}</span><span class="small muted">${TX.num(p.reviews)}</span></div>
        <button class="btn btn-primary btn-sm" data-add="${p.id}">${ic("cart", "ic-sm")} Add to cart</button></div></th>`).join("")}
      ${slot ? `<th class="slot">${addSlot(P, cats)}</th>` : ""}</tr></thead>`;

    const rows = [];
    const grp = (t) => rows.push(`<tr class="grp"><td colspan="${P.length + 1 + (slot ? 1 : 0)}">${t}</td></tr>`);
    const row = (label, vals, keys, extra = "") => {
      const same = keys.every((k) => k === keys[0]);
      rows.push(`<tr class="${same ? "is-same" : "is-diff"}" ${extra}><th>${label}</th>${vals.map((v) => `<td>${v}</td>`).join("")}${slot ? `<td class="slot"></td>` : ""}</tr>`);
    };
    grp("Offer");
    row("Price", P.map((p) => `<div data-price="${p.id}">${TX.priceHTML(p)}</div>${vp(p) === minPrice ? `<span class="best">${ic("check", "ic-sm")} Lowest price</span>` : ""}`), P.map(vp));
    row("Condition", P.map((p) => `${TX.condBadge(p.cond)}<div class="small muted mt-4">${TX.conditions[p.cond].note}</div>`), P.map((p) => p.cond));
    const maxM = Math.max(...P.map(months));
    row("Warranty provider", P.map((p) => `<b>${warrP(p) === "Tradex" ? "Tradex (seller warranty)" : p.brand + " (manufacturer)"}</b><div class="small muted">${p.warranty}</div>${months(p) === maxM && P.some((x) => months(x) !== maxM) ? `<span class="best">${ic("shield", "ic-sm")} Longest cover</span>` : ""}`), P.map((p) => p.warranty));
    row("Stock & delivery", P.map((p) => `<div class="stockline">${TX.stockHTML(p)}</div><div class="small muted mt-4">${p.stock === "supplier" ? "Est." : "Delivery by"} ${p.delivery} · 560034</div>${p.stock === "supplier" ? `<div class="small text-warn mt-4">Partner warehouse · Tradex confirms within 4 h</div>` : ""}`), P.map((p) => p.stock + p.delivery));
    row("Returns", P.map((p) => (/refurb|used/.test(p.cond) ? "10 days" : "7 days")), P.map((p) => (/refurb|used/.test(p.cond) ? 10 : 7)));
    row("Inspection report", P.map((p) => (/refurb|used|openbox/.test(p.cond) ? `<a href="store-product.html?id=${p.id}#inspection">${ic("clipboard", "ic-sm").replace('class="ic', 'style="display:inline;vertical-align:-2px" class="ic')} Unit report</a>` : `<span class="na">New · sealed</span>`)), P.map((p) => /refurb|used|openbox/.test(p.cond)));
    row("Customer rating", P.map((p) => `${TX.stars(p.rating)} <span class="small">${p.rating} · ${TX.num(p.reviews)} verified</span>`), P.map((p) => p.rating));

    if (!mixed && TPL[cats[0]]) {
      const [labels, data] = TPL[cats[0]];
      grp(`${catName(cats[0])} specifications`);
      labels.forEach((l, i) => {
        const vals = P.map((p) => (data[p.id] ? data[p.id][i] : undefined));
        let best = -1;
        if (l === "Weight") { const w = vals.map(kg); best = w.indexOf(Math.min(...w)); }
        row(l, vals.map((v, k) => (v == null ? `<span class="miss" data-tip="Missing from manufacturer data — being verified">${ic("info", "ic-sm")} Not specified</span>` : esc(v) + (k === best ? `<br><span class="best">${ic("check", "ic-sm")} Lightest</span>` : ""))), vals.map((v) => String(v)));
      });
    } else if (!mixed) {
      grp(`${catName(cats[0])} specifications`);
      row("Key specifications", P.map((p) => p.specs.split(" · ").join("<br>")), P.map((p) => p.specs));
    } else {
      grp("Specifications");
      row("Category", P.map((p) => catName(p.cat)), P.map((p) => p.cat));
      row("Key specifications", P.map((p) => p.specs.split(" · ").join("<br>")), P.map((p) => p.specs));
      ["Processor", "Memory (RAM)", "Display", "Sensor", "Lens mount"].forEach((l) => {
        const vals = P.map((p) => { const t = LAP[p.id] ? [LAP_L, LAP[p.id]] : CAM[p.id] ? [CAM_L, CAM[p.id]] : null; const i = t ? t[0].indexOf(l) : -1; return i >= 0 ? t[1][i] : null; });
        row(l, vals.map((v) => (v == null ? `<span class="na">Not applicable</span>` : esc(v))), vals.map(String));
      });
    }
    grp("Buy");
    rows.push(`<tr><th>Add to cart</th>${P.map((p) => `<td><div class="col gap-8"><button class="btn btn-primary btn-sm" data-add="${p.id}">${ic("cart", "ic-sm")} Add to cart</button><a class="btn btn-sm" href="store-product.html?id=${p.id}">View details</a></div></td>`).join("")}${slot ? `<td class="slot"></td>` : ""}</tr>`);

    const t = $("#cmp");
    t.innerHTML = cols + head + `<tbody>${rows.join("")}</tbody>`;
    t.classList.toggle("hl", $("#hl").checked);
    t.classList.toggle("hide-same", $("#hide-same").checked);
    TX.hydrate($("#warn"));
    renderMore(P);
  }
  function addSlot(P, cats) {
    const pool = (cats.length === 1 ? TX.byCat(cats[0]) : TX.products).filter((p) => !ids.includes(p.id));
    return `<div class="add-slot" data-anno="Add another product (max 4)">${ic("plus")}
      <b style="color:var(--tx-1)">Add another product</b><span class="small">${4 - P.length} slot${4 - P.length > 1 ? "s" : ""} left</span>
      <label class="sr-only" for="add-sel">Choose a product</label>
      <select class="select input-sm" id="add-sel"><option value="">Choose ${cats.length === 1 ? "a similar product" : "a product"}…</option>${pool.map((p) => `<option value="${p.id}">${esc(p.brand + " · " + p.title.replace(p.brand + " ", "").slice(0, 38))}</option>`).join("")}</select>
      <button class="btn btn-soft btn-sm" id="add-go">Add to comparison</button>
      <a class="small" href="store-listing.html?cat=${cats[0] || "laptops"}">or browse the category</a></div>`;
  }
  function renderMore(P) {
    const cat = P[0] ? P[0].cat : "laptops";
    const more = TX.byCat(cat).filter((p) => !ids.includes(p.id)).concat(TX.products.filter((p) => p.cat !== cat && !ids.includes(p.id))).slice(0, 5);
    $("#more").innerHTML = more.map(TX.cardHTML).join("");
  }

  document.addEventListener("click", (e) => {
    const t = e.target; let el;
    if ((el = t.closest("[data-rm]"))) { ids = ids.filter((x) => x !== el.dataset.rm); save(); render(); TX.toast("Removed from comparison", "x"); }
    if ((el = t.closest("#src-seg [data-src]"))) { src = el.dataset.src; load(); render(); }
    if (t.closest("#add-go")) { const v = $("#add-sel").value; if (!v) { TX.toast("Choose a product first", "info"); return; } ids.push(v); save(); render(); TX.toast("Added to comparison", "compare"); }
    if (t.closest("#clear")) { ids = []; save(); render(); }
    if (t.closest("#restore")) { src = "mine"; ids = ["lap-01", "lap-02", "lap-08"]; save(); render(); }
    if (t.closest("#only-first")) { const c = TX.byId(ids[0]).cat; ids = ids.filter((x) => TX.byId(x).cat === c); if (ids.length < 2) ids = TX.byCat(c).slice(0, 3).map((p) => p.id); render(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "hl") $("#cmp").classList.toggle("hl", e.target.checked);
    if (e.target.id === "hide-same") $("#cmp").classList.toggle("hide-same", e.target.checked);
    if (e.target.matches("#more [data-compare]")) {
      if (src !== "mine") { ids = ids.includes(e.target.dataset.compare) ? ids : ids.concat(e.target.dataset.compare).slice(0, 4); render(); return; }
      if (usingFallback) TX.store.set("compare", [...new Set(FALLBACK.concat(TX.store.get("compare", [])))].slice(0, 4));
      setTimeout(() => { load(); render(); }, 0);
    }
  });
  document.addEventListener("tx:view", render);
  load(); render();
});
</script>
</body>
</html>
