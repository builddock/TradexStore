<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Browse calibrated QMK / VIA / Hall-Effect certified mechanical keyboards, docks and peripherals with live spec filtering.">
<meta name="color-scheme" content="light">
<link rel="icon" href="assets/img/logo-tradex-full.png">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/icons.css">
<link rel="stylesheet" href="assets/css/tokens.css">

</head>
<body data-page="catalog">

<div id="chrome-header"></div>

<main id="main">
  <div class="container">

    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="home.html">Home</a>
      <span class="ms ms-sm" aria-hidden="true">chevron_right</span>
      <a href="catalog.html">Hardware Inventory</a>
      <span class="ms ms-sm" aria-hidden="true">chevron_right</span>
      <span class="current">Mechanical Keyboards &amp; Peripherals</span>
    </nav>

    <div class="page-head">
      <div>
        <div class="row row-wrap" style="gap:0.5rem">
          <span class="badge badge-tonal badge-wrap">Catalog Node 04 // Peripherals</span>
          <span class="t-mono-sm t-primary">
            <span class="ms ms-sm" aria-hidden="true">verified</span> QMK / VIA / Hall-Effect Certified
          </span>
        </div>
        <h1 class="t-display" style="margin-top:0.625rem">Mechanical Keyboards &amp; Peripherals</h1>

      <div class="stat-card">
        <b id="stat-units">18</b>
        <span>Hardware units active</span>
      </div>
    </div>

    <div class="active-criteria" id="criteria-root"></div>

      <span class="ms ms-sm" aria-hidden="true">tune</span>Filters &amp; Spec Envelope

    <div class="catalog-layout">
      <aside class="filters" id="filter-root" aria-label="Filter hardware"></aside>

      <div>
        <div class="catalog-toolbar" id="toolbar-root"></div>
        <div class="grid-catalog" id="grid-root" aria-live="polite"></div>
        <div class="catalog-foot" id="foot-root"></div>
      </div>
    </div>

  </div>
</main>

<div class="filter-scrim" id="filter-scrim"></div>
<div id="checkout-bar" class="checkout-bar"></div>
<div id="chrome-footer"></div>

<script src="assets/js/data.js"></script>
